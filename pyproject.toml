[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holonbridge"
version = "3.0.0"
# Version had never been bumped from the 0.1.0 scaffold default despite
# substantial feature work landing on main (persona-scoped ACL gating,
# Toolset-based reachability for named queries/rules/pipelines,
# create_holon/create_message, pipeline ACL gating). Set to 3.0.0 on
# 2026-08-31 to reflect actual production maturity rather than continue
# under-reporting it. No formal semver history exists before this point
# (no tags, no releases) -- this is a one-time correction, not a claim
# of two skipped major releases.
description = "Python implementation of the HGA Server — REST + MCP bridge between the Holon Graph Architecture pipeline and Apache Jena Fuseki, with persona-scoped ACL gating (Animus identity, write/replace grants), Toolset-based reachability gating for named queries/rules/pipelines, and DataBook-native holon/message ingestion."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rdflib>=7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Upper bound is load-bearing: mcp 2.0 removed mcp.server.fastmcp entirely,
# replacing it with mcp.server.mcpserver. Porting to it is real work, not a
# version bump, and an unbounded ">=1.2" silently resolves to the broken one.
mcp = ["mcp>=1.2,<2"]
shacl = ["pyshacl>=0.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
holonbridge = "holonbridge.server:main"
holonbridge-mcp = "holonbridge_mcp.__main__:main"
holonbridge-bootstrap-admin = "holonbridge.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["holonbridge", "holonbridge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
